name: Headless startup diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build with symbols
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config RelWithDebInfo --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture no-hardware startup exception
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile procdump.zip
          Expand-Archive procdump.zip procdump
          $signature = Get-AuthenticodeSignature procdump/procdump64.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Untrusted ProcDump' }
          New-Item -ItemType Directory dumps | Out-Null
          # Fresh runner, no RF/audio capture, no control token or deployment secrets.
          & ./procdump/procdump64.exe -accepteula -e -x dumps ./build/RelWithDebInfo/FUBAR.exe --cli --web-only --duration 3
          exit 0
      - name: Retain symbolized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-diagnostics
          path: |
            dumps/*.dmp
            build/RelWithDebInfo/FUBAR.exe
            build/RelWithDebInfo/FUBAR.pdb
          retention-days: 3
