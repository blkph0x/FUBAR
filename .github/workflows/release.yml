name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v1.1.51

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build and test
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test_web_ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S scripts/control-tests -B build/control-tests -A x64 "-DFUBAR_BUILD=$pwd/build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/control-tests --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/control-tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare browser tests
        run: npm install --prefix build/browser-deps --no-save --package-lock=false playwright@1.62.1

      - name: Assemble portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ github.workspace }}/build/browser-deps/node_modules
        run: |
          & ./scripts/stage_town_pair.ps1 -Package package
          Copy-Item build/Release/FUBAR.exe package/FUBAR.exe
          python scripts/test_bridge_payload.py --fubar package/FUBAR.exe --dll package/SdrTownControl.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_control_loopback.py --fubar package/FUBAR.exe --dll package/SdrTownControl.dll --browser --output build/hardening-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_town_pair.py --town town/SDR_Town.exe --fubar package/FUBAR.exe --dll package/SdrTownControl.dll --duration 180 --browser --output build/pair-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_town_pair.py --town town/SDR_Town.exe --fubar package/FUBAR.exe --dll package/SdrTownControl.dll --output build/pair-auto --automatic-pairing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md package/README.md
          Copy-Item CHANGELOG.md package/CHANGELOG.md
          Copy-Item docs package/docs -Recurse
          $source = (git rev-parse HEAD).Trim()
          $pair = Get-Content package/town-pair.json -Raw | ConvertFrom-Json
          [ordered]@{
            version = '${{ inputs.tag }}'
            sourceCommit = $source
            workflowRun = $env:GITHUB_RUN_ID
            townVersion = $pair.version
            townSourceCommit = $pair.sourceCommit
            townPortableSha256 = $pair.portableSha256
            townWorkflowRun = $pair.workflowRun
            townExecutableSha256 = $pair.executableSha256
            executableSha256 = (Get-FileHash package/FUBAR.exe).Hash.ToLowerInvariant()
            controlDllSha256 = (Get-FileHash package/SdrTownControl.dll).Hash.ToLowerInvariant()
            controlRuntime = @('MSVCP140.dll', 'VCRUNTIME140.dll', 'VCRUNTIME140_1.dll')
          } | ConvertTo-Json | Set-Content package/build-info.json -Encoding utf8
          Compress-Archive -Path package/* -DestinationPath FUBAR-Windows-x64.zip -Force
          $hash = (Get-FileHash FUBAR-Windows-x64.zip).Hash.ToLowerInvariant()
          "$hash  FUBAR-Windows-x64.zip" | Set-Content FUBAR-Windows-x64.zip.sha256 -Encoding ascii

      - name: Create GitHub release and upload package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" FUBAR-Windows-x64.zip FUBAR-Windows-x64.zip.sha256 --title "FUBAR ${{ inputs.tag }}" --notes-file CHANGELOG.md --latest=false

      - name: Verify public package
        shell: pwsh
        run: |
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/${{ inputs.tag }}"
          Invoke-WebRequest "$base/FUBAR-Windows-x64.zip" -OutFile public.zip -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash public.zip).Hash -ne (Get-FileHash FUBAR-Windows-x64.zip).Hash) { throw 'Public package mismatch' }
          Expand-Archive public.zip -DestinationPath public
          $info = Get-Content public/build-info.json -Raw | ConvertFrom-Json
          if ($info.sourceCommit -ne (git rev-parse HEAD).Trim()) { throw 'Source provenance mismatch' }
          & ./public/FUBAR.exe --cli --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain paired diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-diagnostics
          path: |
            build/pair-test/*.sanitized.log
            build/pair-test/result.json
            build/pair-test/browser.log
            build/pair-test/*.png
            build/pair-auto/*.sanitized.log
            build/pair-auto/result.json
            build/hardening-test/*.sanitized.log
            build/hardening-test/result.json
            build/hardening-test/browser.log
            build/hardening-test/*.png
          if-no-files-found: ignore
