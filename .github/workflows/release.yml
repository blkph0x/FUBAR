name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v1.1.42

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build and test
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - name: Assemble portable package
        shell: pwsh
        run: |
          $townRelease = Invoke-RestMethod -Headers @{ 'User-Agent' = 'FUBAR-release' } `
            'https://api.github.com/repos/blkph0x/SDR_Town/releases/tags/v0.2.119'
          $townAsset = $townRelease.assets | Where-Object { $_.name -like '*win64.zip' } | Select-Object -First 1
          if (-not $townAsset) { throw 'Matching SDR Town 0.2.119 release ZIP was not found.' }
          Invoke-WebRequest -Headers @{ 'User-Agent' = 'FUBAR-release' } -Uri $townAsset.browser_download_url -OutFile town.zip
          Expand-Archive town.zip -DestinationPath town -Force
          $townDll = Get-ChildItem town -Filter SdrTownControl.dll -Recurse | Select-Object -First 1
          if (-not $townDll) { throw 'Matching SdrTownControl.dll was not found in the Town release.' }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/FUBAR.exe package/FUBAR.exe
          Copy-Item $townDll.FullName package/SdrTownControl.dll
          Copy-Item README.md package/README.md
          Copy-Item CHANGELOG.md package/CHANGELOG.md
          Compress-Archive -Path package/* -DestinationPath FUBAR-Windows-x64.zip -Force

      - name: Create GitHub release and upload package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" FUBAR-Windows-x64.zip --title "FUBAR ${{ inputs.tag }}" --notes-file CHANGELOG.md
