name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test_web_ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble portable package
        shell: pwsh
        run: |
          $townRelease = Invoke-RestMethod -Headers @{ 'User-Agent' = 'FUBAR-ci' } `
            'https://api.github.com/repos/blkph0x/SDR_Town/releases/tags/v0.2.120-experimental'
          $townAsset = $townRelease.assets | Where-Object { $_.name -like '*win64*.zip' -and $_.name -notlike '*.sha256' } | Select-Object -First 1
          if (-not $townAsset) { throw 'Matching SDR Town 0.2.120 release ZIP was not found.' }
          Invoke-WebRequest -Headers @{ 'User-Agent' = 'FUBAR-ci' } -Uri $townAsset.browser_download_url -OutFile town.zip
          Expand-Archive town.zip -DestinationPath town -Force
          $townDll = Get-ChildItem town -Filter SdrTownControl.dll -Recurse | Select-Object -First 1
          if (-not $townDll) { throw 'Matching SdrTownControl.dll was not found in the Town release.' }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/FUBAR.exe package/FUBAR.exe
          Copy-Item $townDll.FullName package/SdrTownControl.dll
          Copy-Item README.md package/README.md
          Copy-Item CHANGELOG.md package/CHANGELOG.md
          Compress-Archive -Path package/* -DestinationPath FUBAR-Windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FUBAR-Windows-x64
          path: FUBAR-Windows-x64.zip
